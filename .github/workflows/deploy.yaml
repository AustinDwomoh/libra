# =========================================
# GitHub Actions Workflow: Libra CI/CD
# Deploys Discord API via SSH + systemd
# Features:
# - Installs dependencies in existing venv
# - Restarts API with systemd
# - Discord notifications
# =========================================
name: Libra Deploy CI/CD

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Deploy to server
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            cd /var/www/libra/

            # Activate virtualenv
            source libra/bin/activate

            # Pull latest code
            git fetch origin
            git reset --hard origin/master
            

            # Install/upgrade dependencies
            pip install -r requirements.txt --upgrade-strategy only-if-needed

            # ── Self-sufficient setup (merged in from installer.ps1) ──────────
            # Every deploy re-asserts the full environment so it never depends
            # on a separately-run installer script.

            # Ensure manual-install packages are present (in case requirements.txt
            # doesn't pin them yet)
            pip install --upgrade gunicorn uvicorn asyncpg pgvector ollama

            # Ensure Playwright browsers/deps are present
            playwright install
            playwright install-deps

            # Ensure Ollama binary is installed
            if ! command -v ollama >/dev/null 2>&1; then
              curl -fsSL https://ollama.com/install.sh | sh
            fi

            # Ensure required models are pulled (idempotent). Runs before the
            # service restart so a failed pull is caught here, not after libra
            # restarts into a broken state.
            ollama list | grep -q "qwen2.5:3b-instruct" || ollama pull qwen2.5:3b-instruct
            ollama list | grep -q "nomic-embed-text" || ollama pull nomic-embed-text

            # Restart API with systemd
            sudo systemctl restart libra

      # Step 3: Notify Discord on failure
      - name: Notify Discord on failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -d "{\"content\": \":x: <@755872891601551511>\nLibra API deploy failed for **${{ github.repository }}** @ **${{ github.ref_name }}**\"}" \
          ${{ secrets.DISCORD_WEBHOOK }}

      # Step 4: Notify Discord on success
      - name: Notify Discord on success
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -d "{\"content\": \":white_check_mark: <@755872891601551511>\nLibra API deployed successfully on **${{ github.repository }}** @ **${{ github.ref_name }}**\"}" \
          ${{ secrets.DISCORD_WEBHOOK }}
