# This workflow is triggered on a schedule and runs the scraper, enrichment, and expiration tasks on a remote server via SSH. It also notifies a Discord channel on failure or success of the tasks.
name: Automation

on:
  schedule:
    # Scrape + enrich, 3x/week. Job boards don't refresh meaningfully more
    # often than every 2-3 days, so these are spread for even weekly coverage
    # (no back-to-back days; ~54h / ~54h / ~60h apart) rather than frequency.
    # Times are also staggered across the day to catch postings made at
    # different hours. GitHub crons are UTC and may be delayed a few minutes.
    - cron: '0 8 * * 1'    # Mon 08:00 UTC (~03:00 ET) - scrape + enrich
    - cron: '0 14 * * 3'   # Wed 14:00 UTC (~09:00 ET) - scrape + enrich
    - cron: '0 20 * * 5'   # Fri 20:00 UTC (~15:00 ET) - scrape + enrich
    # Weekly expiry sweep, on a day with no scrape so the 4GB VPS isn't
    # running Playwright + Ollama for two heavy jobs at once.
    - cron: '0 6 * * 6'    # Sat 06:00 UTC (~01:00 ET) - weekly expiry checker
  workflow_dispatch:

jobs:
  scrape:
    name: Scrape Jobs
    runs-on: ubuntu-latest
    # scrape has no `needs`, so without this it would also fire on the Sat
    # expiry cron. Restrict it to its own three crons (+ manual dispatch).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 8 * * 1' ||
      github.event.schedule == '0 14 * * 3' ||
      github.event.schedule == '0 20 * * 5'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run scraper via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: "60m" 
          script: |
            set -euo pipefail

            if [ ! -d /var/www/libra ]; then
              echo "Directory /var/www/libra does not exist, skipping."
              exit 0
            fi

            cd /var/www/libra/
            source libra/bin/activate
            git fetch origin
            git reset --hard origin/master

            mkdir -p logs

            pip install -r requirements.txt --upgrade-strategy only-if-needed
            PYTHONPATH=/var/www/libra python3 Tasks/scrape.py > logs/scrape.log 2>&1

      - name: Notify Discord on failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -d "{\"content\": \":x: <@755872891601551511>\nLibra **scrape** failed for **${{ github.repository }}** @ **${{ github.ref_name }}**\"}" \
          ${{ secrets.DISCORD_WEBHOOK }}

  enrich:
     name: Enrich Jobs
     runs-on: ubuntu-latest
     needs: scrape
     # No schedule filter: enrich runs every time scrape does. `needs: scrape`
     # already gates it (skipped scrape -> skipped enrich, failed scrape ->
     # skipped enrich).
     steps:
       - name: Checkout
         uses: actions/checkout@v4

       - name: Run enrichment via SSH
         uses: appleboy/ssh-action@v0.1.7
         with:

           host: ${{ secrets.SSH_HOST }}
           username: ${{ secrets.SSH_USER }}
           key: ${{ secrets.SSH_PRIVATE_KEY }}
           command_timeout: "60m" 
           script: |
             set -euo pipefail

             if [ ! -d /var/www/libra ]; then
               echo "Directory /var/www/libra does not exist, skipping."
               exit 0
             fi

             cd /var/www/libra/
             source libra/bin/activate

             mkdir -p logs

             PYTHONPATH=/var/www/libra python3 Tasks/enrich.py > logs/enrich.log 2>&1

       - name: Notify Discord on failure
         if: failure()
         run: |
           curl -H "Content-Type: application/json" \
           -d "{\"content\": \":x: <@755872891601551511>\nLibra **enrich** failed for **${{ github.repository }}** @ **${{ github.ref_name }}**\"}" \
           ${{ secrets.DISCORD_WEBHOOK }}
    
  expired:
    name: Expire Jobs
    runs-on: ubuntu-latest
    needs: enrich
    # Matches the Sat 06:00 UTC cron in on.schedule exactly (+ manual dispatch).
    if: github.event.schedule == '0 6 * * 6' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run expiration via SSH and notify Discord with logs
        uses: appleboy/ssh-action@v0.1.7
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: "60m"
          envs: DISCORD_WEBHOOK,REPO,REF
          script: |
            set -uo pipefail   # no -e: a failing python run must not skip the notify step below

            if [ ! -d /var/www/libra ]; then
              echo "Directory /var/www/libra does not exist, skipping."
              exit 0
            fi

            cd /var/www/libra/
            source libra/bin/activate
            mkdir -p logs
            LOG_FILE=logs/expired.log
            
            git fetch origin
            git reset --hard origin/master

            PYTHONPATH=/var/www/libra python3 Tasks/expired.py > "$LOG_FILE" 2>&1
            STATUS=$?

            if [ $STATUS -eq 0 ]; then
              MSG=":white_check_mark: <@755872891601551511>\nLibra **expire** succeeded for **${REPO}** @ **${REF}**"
            else
              MSG=":x: <@755872891601551511>\nLibra **expire** failed for **${REPO}** @ **${REF}**"
            fi

            curl -sS \
              -F "payload_json={\"content\": \"${MSG}\"}" \
              -F "file1=@${LOG_FILE}" \
              "${DISCORD_WEBHOOK}"

            exit $STATUS

     
