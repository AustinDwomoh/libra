name: Libra API CI/CD

on:
  push:
    branches:
      - '**'
  issues:
    types: [opened, reopened, closed]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord on push (failure)
        if: failure() && github.event_name == 'push'
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          MESSAGE: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          PAYLOAD=$(jq -rn --arg content ":x: <@1518712035896987729>\n**Deploy Failed**\n**Repo:** $REPO\n**Branch:** $BRANCH\n**Commit:** $SHA\n**Message:** $MESSAGE\n**Author:** $AUTHOR" '{content: $content}')
          curl -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK"

      - name: Notify Discord on push (success)
        if: success() && github.event_name == 'push'
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          URL: ${{ github.event.head_commit.url }}
          MESSAGE: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          PAYLOAD=$(jq -rn --arg content ":white_check_mark: <@1518712035896987729> \n **Deploy Successful** \n **Repo:** $REPO \n **Branch:** $BRANCH\n**Commit:** [\`$SHA\`]($URL)\n**Message:** $MESSAGE\n**Author:** $AUTHOR" '{content: $content}')
          curl -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK"

      - name: Notify Discord on new issue
        if: github.event_name == 'issues'
        env:
          REPO: ${{ github.repository }}
          TITLE: ${{ github.event.issue.title }}
          USER: ${{ github.event.issue.user.login }}
          LINK: ${{ github.event.issue.html_url }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          PAYLOAD=$(jq -rn --arg content ":bug: <@1518712035896987729>\n**New Issue Opened**\n**Repo:** $REPO\n**Title:** $TITLE\n**By:** $USER\n**Link:** $LINK" '{content: $content}')
          curl -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK"

      - name: Notify Discord on issue closed
        if: github.event_name == 'issues' && github.event.action == 'closed'
        env:
          REPO: ${{ github.repository }}
          TITLE: ${{ github.event.issue.title }}
          USER: ${{ github.event.issue.user.login }}
          LINK: ${{ github.event.issue.html_url }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          PAYLOAD=$(jq -rn --arg content ":white_check_mark: <@1518712035896987729>\n**Issue Closed**\n**Repo:** $REPO\n**Title:** $TITLE\n**By:** $USER\n**Link:** $LINK" '{content: $content}')
          curl -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK"
